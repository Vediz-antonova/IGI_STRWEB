{% extends "base.html" %}
{% load static %}

{% block css %}
  <link rel="stylesheet" href="{% static 'css/goods/catalog.css' %}">
{% endblock %}

{% block content %}
<section class="catalog-wrapper">

  <!-- Фильтры -->
  <details class="filter-dropdown">
    <summary>Фильтры</summary>
    <form action="{% url 'catalog' slug_url %}" method="get">
      <fieldset>
        <legend>Сортировать:</legend>
        <label><input type="radio" name="order_by" value="default"
          {% if not request.GET.order_by or request.GET.order_by == 'default' %}checked{% endif %}> По умолчанию</label>
        <label><input type="radio" name="order_by" value="default_price"
          {% if request.GET.order_by == 'default_price' %}checked{% endif %}> От дешевых к дорогим</label>
        <label><input type="radio" name="order_by" value="-default_price"
          {% if request.GET.order_by == '-default_price' %}checked{% endif %}> От дорогих к дешевым</label>
      </fieldset>
      <button type="submit">Применить</button>
    </form>
  </details>

  <!-- Кнопка добавления -->
  {% if request.user.is_authenticated and request.user.is_employee %}
    <div class="add-product-button">
      <a href="{% url 'add_product' %}">+ Добавить товар</a>
    </div>
  {% endif %}

  <!-- Селектор количества -->
  <div class="page-size-selector">
    <label for="page-size">Показать на странице:</label>
    <select id="page-size">
      <option value="3">3</option>
      <option value="6">6</option>
      <option value="9">9</option>
      <option value="12">12</option>
    </select>
  </div>

  <!-- Сетка товаров -->
  <div class="product-grid" id="product-grid"></div>

  <!-- Пагинация -->
  <div class="pagination-nav">
    <div id="pagination-controls"></div>
  </div>

  <!-- JS-данные -->
  <script>
    const productsData = [
      {% for good in products %}
        {
          id: {{ good.id }},
          name: "{{ good.name|escapejs }}",
          description: "{{ good.description|escapejs }}",
          article: "{{ good.article }}",
          quantity: {{ good.quantity }},
          price: "{{ good.default_price }}",
          image: "{% if good.image %}{{ good.image.url }}{% else %}{% static 'images/Not found image.png' %}{% endif %}",
          slug: "{{ good.slug }}"
        },
      {% endfor %}
    ];
  </script>
  <script src="{% static 'js/catalog_pagination.js' %}"></script>
</section>
{% endblock %}
