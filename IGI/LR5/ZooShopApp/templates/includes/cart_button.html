{% load static %}
{% load carts_tags %}

{% user_carts request as carts %}

<div class="cart-button-wrapper">
  <button type="button" class="cart-button" id="modalButton" aria-expanded="false">
    <img src="{% static 'icons/basket2-fill.svg' %}" alt="Корзина" width="24" height="24">
    <span id="goods-in-cart-count">{{ carts.total_quantity }}</span>
  </button>
</div>

<!-- Модальное окно корзины -->
<section class="cart-modal" id="cartModal" aria-hidden="true">
  <div class="cart-modal-overlay" id="cartOverlay"></div>
  <div class="cart-modal-content" role="dialog" aria-labelledby="cartModalTitle">
    <header class="cart-modal-header">
      <h3 id="cartModalTitle">Корзина</h3>
      <button class="cart-close-button" id="closeModal" aria-label="Закрыть">✖</button>
    </header>
    <div class="cart-modal-body">
      <div id="cart-items-container">
        {% include "carts/includes/included_cart.html" %}
      </div>
    </div>
  </div>
</section>

<script>
  $(document).ready(function () {
    const successMessage = $("#jq-notification");

    // Добавление товара в корзину
    $(document).on("click", ".add-to-cart", function (e) {
      e.preventDefault();
      const goodsInCartCount = $("#goods-in-cart-count");
      let cartCount = parseInt(goodsInCartCount.text() || 0);
      const product_id = $(this).data("product-id");
      const add_to_cart_url = $(this).attr("href");

      $.ajax({
        type: "POST",
        url: add_to_cart_url,
        data: {
          product_id: product_id,
          csrfmiddlewaretoken: $("[name=csrfmiddlewaretoken]").val(),
        },
        success: function (data) {
          successMessage.html(data.message).fadeIn(400);
          setTimeout(() => successMessage.fadeOut(400), 7000);
          cartCount++;
          goodsInCartCount.text(cartCount);
          $("#cart-items-container").html(data.cart_items_html);
        },
        error: function () {
          console.log("Ошибка при добавлении товара в корзину");
        },
      });
    });

    // Удаление товара из корзины
    $(document).on("click", ".remove-from-cart", function (e) {
      e.preventDefault();
      const goodsInCartCount = $("#goods-in-cart-count");
      let cartCount = parseInt(goodsInCartCount.text() || 0);
      const cart_id = $(this).data("cart-id");
      const remove_from_cart = $(this).attr("href");

      $.ajax({
        type: "POST",
        url: remove_from_cart,
        data: {
          cart_id: cart_id,
          csrfmiddlewaretoken: $("[name=csrfmiddlewaretoken]").val(),
        },
        success: function (data) {
          successMessage.html(data.message).fadeIn(400);
          setTimeout(() => successMessage.fadeOut(400), 7000);
          cartCount -= data.quantity_deleted;
          goodsInCartCount.text(cartCount);
          $("#cart-items-container").html(data.cart_items_html);
        },
        error: function () {
          console.log("Ошибка при удалении товара из корзины");
        },
      });
    });

    // Изменение количества товара
    $(document).on("click", ".decrement, .increment", function () {
      const isIncrement = $(this).hasClass("increment");
      const url = $(this).data("cart-change-url");
      const cartID = $(this).data("cart-id");
      const $input = $(this).closest(".input-group").find(".number");
      let currentValue = parseInt($input.val());

      if (!isIncrement && currentValue > 1) {
        $input.val(currentValue - 1);
        updateCart(cartID, currentValue - 1, -1, url);
      } else if (isIncrement) {
        $input.val(currentValue + 1);
        updateCart(cartID, currentValue + 1, 1, url);
      }
    });

    function updateCart(cartID, quantity, change, url) {
      $.ajax({
        type: "POST",
        url: url,
        data: {
          cart_id: cartID,
          quantity: quantity,
          csrfmiddlewaretoken: $("[name=csrfmiddlewaretoken]").val(),
        },
        success: function (data) {
          successMessage.html(data.message).fadeIn(400);
          setTimeout(() => successMessage.fadeOut(400), 7000);
          const goodsInCartCount = $("#goods-in-cart-count");
          let cartCount = parseInt(goodsInCartCount.text() || 0);
          cartCount += change;
          goodsInCartCount.text(cartCount);
          $("#cart-items-container").html(data.cart_items_html);
        },
        error: function () {
          console.log("Ошибка при обновлении количества");
        },
      });
    }

    // Открытие модального окна корзины
    $("#modalButton").click(function () {
      $("#cartModal").attr("aria-hidden", "false");
    });

    // Закрытие модального окна
    $("#closeModal, #cartOverlay").click(function () {
      $("#cartModal").attr("aria-hidden", "true");
    });

    // Скрытие уведомления
    const notification = $("#notification");
    if (notification.length > 0) {
      setTimeout(() => notification.alert("close"), 4000);
    }

    // Выбор способа доставки
    $("input[name='requires_delivery']").change(function () {
      const selectedValue = $(this).val();
      if (selectedValue === "1") {
        $("#deliveryAddressField").show();
      } else {
        $("#deliveryAddressField").hide();
      }
    });
  });
</script>
